name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Pint + Pest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests (Pest)
        run: php artisan test

  deploy:
    name: Deploy a producción
    needs: tests
    # Solo se despliega cuando hay push a main (no en pull requests).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar el deploy en Laravel Forge
        # Secrets necesarios en el repositorio:
        #   FORGE_SERVER_ID, FORGE_SITE_ID, FORGE_DEPLOY_TOKEN
        run: |
          curl --fail --silent --show-error \
            "https://forge.laravel.com/servers/${{ secrets.FORGE_SERVER_ID }}/sites/${{ secrets.FORGE_SITE_ID }}/deploy/http?token=${{ secrets.FORGE_DEPLOY_TOKEN }}"
        # El deploy de Forge ya ejecuta: git pull, composer install,
        # migraciones, caches de Laravel y reinicio de Horizon.
